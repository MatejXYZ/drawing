<!DOCTYPE html>
<html lang="en">

<head>
    <title>Drawing</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="editor.css">
    <link rel="stylesheet" href="nav.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="editor.js"></script>
</head>

<body>
    <nav>
        <a href="editor.html">editor</a>
        <a href="gallery.html">gallery</a>
    </nav>
    <main>
        <form>
            <label for="color">Color</label>
            <input id="color" type="color" autocomplete="off">

            <label for="size">Size</label>
            <input id="size" type="range" min="1" max="300" autocomplete="off">

            <label for="eraser">Eraser</label>
            <input type="radio" id="eraser" name="tool" value="Eraser" autocomplete="off">
            <label for="brush">Brush</label>
            <input type="radio" id="brush" name="tool" value="Brush" checked autocomplete="off">
        </form>
        <canvas width="1000" height="1000"></canvas>
        <div class="canvas-control">
            <button>Save to gallery</button>
            <button>Download</button>
        </div>
    </main>
</body>

</html>
